name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit and integration tests
        run: pnpm test
      - name: Requirement traceability
        run: |
          pnpm traceability
          node scripts/check-traceability.mjs --matrix | diff - docs/compliance/traceability-matrix.md
      - name: Build
        run: pnpm build
        env:
          TURSO_DATABASE_URL: file:data/ci.db
          TURSO_AUTH_TOKEN: ci
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: pnpm test:e2e
      - name: Keep the e2e report as validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.sha }}
          path: e2e-report
          retention-days: 90
